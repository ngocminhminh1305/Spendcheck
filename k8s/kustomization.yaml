# Deploy everything with:  kubectl apply -k k8s/
# Before the first deploy, see k8s/README.md (images on the node, db-init ConfigMap, secrets.env).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: spendcheck

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 10-postgres.yaml
  - 20-extractor.yaml
  - 21-categoriser.yaml
  - 22-forecaster.yaml
  - 25-gateway.yaml
  - 26-frontend.yaml
  - 30-chat-agent.yaml
  - 31-report-reader.yaml
  - 40-report-ingest.yaml
  - 50-ingress.yaml

# Passwords come from k8s/secrets.env (git-ignored; copy secrets.env.example).
secretGenerator:
  - name: spendcheck-db
    envs:
      - secrets.env

# Manifests use short image names; this maps them to the ECR repositories in the Learner Lab
# account (us-east-1). The deploy step pulls each image from ECR onto the VM once
# (k8s/README.md, step 2); every container sets imagePullPolicy: Never, so Kubernetes runs that
# local copy and never needs AWS credentials, which in the Learner Lab expire after a few hours.
# A release re-uses the tag: pull the new image, then restart its deployment (README, step 2).
images:
  - name: spendcheck/extractor
    newName: 767397718813.dkr.ecr.us-east-1.amazonaws.com/spendcheck/extractor
    newTag: v1
  - name: spendcheck/categoriser
    newName: 767397718813.dkr.ecr.us-east-1.amazonaws.com/spendcheck/categoriser
    newTag: v1
  - name: spendcheck/forecaster
    newName: 767397718813.dkr.ecr.us-east-1.amazonaws.com/spendcheck/forecaster
    newTag: v1
  - name: spendcheck/gateway
    newName: 767397718813.dkr.ecr.us-east-1.amazonaws.com/spendcheck/gateway
    newTag: v1
  - name: spendcheck/frontend
    newName: 767397718813.dkr.ecr.us-east-1.amazonaws.com/spendcheck/frontend
    newTag: v1
  - name: spendcheck/chat-agent
    newName: 767397718813.dkr.ecr.us-east-1.amazonaws.com/spendcheck/chat-agent
    newTag: v1
  - name: spendcheck/report-reader
    newName: 767397718813.dkr.ecr.us-east-1.amazonaws.com/spendcheck/report-reader
    newTag: v1
