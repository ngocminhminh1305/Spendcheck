# API gateway: the website's single entry point. Reachable inside the cluster as http://gateway:8000
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: spendcheck/gateway
          imagePullPolicy: Never              # only the copy loaded onto the VM, never a registry
          ports:
            - containerPort: 8000
          env:
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: spendcheck-db, key: APP_DB_PASSWORD }
            - name: DATABASE_URL
              value: postgresql://spendcheck_app:$(APP_DB_PASSWORD)@postgres:5432/spendcheck
            - name: DEMO_USER_ID
              value: demo-user
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
