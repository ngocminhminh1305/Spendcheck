# Module 5: SGX Report Reader. Reachable inside the cluster as http://report-reader:8000
apiVersion: v1
kind: Service
metadata:
  name: report-reader
spec:
  selector:
    app: report-reader
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-reader
  labels:
    app: report-reader
    module: m5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-reader
  template:
    metadata:
      labels:
        app: report-reader
        module: m5
    spec:
      containers:
        - name: report-reader
          image: spendcheck/report-reader     # ECR name and tag set in kustomization.yaml
          imagePullPolicy: Never              # the copy pulled from ECR at deploy time (README step 2)
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: spendcheck-config
          env:
            - name: REPORT_READER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: spendcheck-db, key: REPORT_READER_DB_PASSWORD }
            - name: DATABASE_URL
              value: postgresql://report_reader:$(REPORT_READER_DB_PASSWORD)@postgres:5432/spendcheck
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef: { name: spendcheck-db, key: OPENROUTER_API_KEY, optional: true }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: spendcheck-db, key: ANTHROPIC_API_KEY, optional: true }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20             # the embedding model loads at startup
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1536Mi }
