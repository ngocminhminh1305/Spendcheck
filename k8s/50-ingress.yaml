# Front door: k3s's built-in Traefik listens on port 80 of the VM and sends every request to the
# website, which forwards /api to the gateway. On Ronin, reach it through an SSH tunnel
# (k8s/README.md), so the site and its AI quota are not open to the internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spendcheck
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
