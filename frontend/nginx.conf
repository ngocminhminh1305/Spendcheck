# Serves the built site and forwards /api to the gateway (the compose / Kubernetes service "gateway").
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;   # one trace ID from here through every module
        proxy_read_timeout 180s;                     # the free LLM can take tens of seconds
    }

    # Vite puts content hashes in asset names, so they can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths fall back to index.html. index.html names the current asset
    # hashes, so browsers must re-check it on every visit or they keep running an old build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
